services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: barpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-bar_pos}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bar_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barpos-net

  # ==============================================================================
  # 2. Backend REST API Service (Port 4000)
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: barpos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-bar_pos}
      JWT_SECRET: ${JWT_SECRET:-super_secret_bar_pos_jwt_key_2026_dev}
      NODE_ENV: production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - barpos-net

  # ==============================================================================
  # 3. Customer Mobile QR Web App (Port 3001)
  # ==============================================================================
  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    container_name: barpos-customer
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    networks:
      - barpos-net

  # ==============================================================================
  # 4. Cashier POS Web Terminal (Port 3002)
  # ==============================================================================
  pos:
    build:
      context: .
      dockerfile: apps/pos/Dockerfile
    container_name: barpos-pos
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3002:80"
    networks:
      - barpos-net

  # ==============================================================================
  # 5. Admin Management Portal (Port 3003)
  # ==============================================================================
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: barpos-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3003:80"
    networks:
      - barpos-net

volumes:
  pgdata:
    driver: local

networks:
  barpos-net:
    driver: bridge
